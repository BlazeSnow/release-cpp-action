name: 'release-cpp-action'
description: '构建 Cpp 程序并上传构建产物至 GitHub Release（在多平台矩阵 workflow 中每个平台调用一次）'
branding:
  icon: 'package'
  color: 'green'

inputs:
  name:
    description: '程序名称，用作编译目标名与产物文件名前缀'
    required: true
  base-dir:
    description: 'BASE 目录，即 Cpp 源码所在目录（含 CMakeLists.txt 或 *.cpp）'
    required: false
    default: '.'
  release:
    description: '是否上传构建产物至 GitHub Release'
    required: false
    default: false
    type: boolean
  extra-files:
    description: '额外上传至 Release 的文件，每行一个（相对于 BASE 目录）'
    required: false
    default: ''
  release-body:
    description: 'Release 说明正文（仅在自动创建 Release 时使用，默认自动生成）'
    required: false
    default: ''
  release-name:
    description: '自定义 Release 标题（默认与 tag 同名）'
    required: false
    default: ''
  prerelease:
    description: '将 Release 标记为预发布版本'
    required: false
    default: false
    type: boolean
  draft:
    description: '将 Release 存为草稿，不直接发布'
    required: false
    default: false
    type: boolean
  tag:
    description: '目标 Release 的 tag（默认为当前 ref 名称，建议以 tag 推送触发）'
    required: false
    default: ''
  token:
    description: 'GitHub Token（用于创建/上传 Release）'
    required: false
    default: ${{ github.token }}

outputs:
  artifact-path:
    description: '构建产物路径'
    value: ${{ steps.build.outputs.artifact-path || steps.build-macos.outputs.artifact-path || steps.build-windows.outputs.artifact-path }}
  version:
    description: '版本号（tag 输入，缺省为当前 ref 名称）'
    value: ${{ inputs.tag || github.ref_name }}

runs:
  using: 'composite'
  steps:
    - name: 构建 Cpp 程序（Linux）
      id: build
      if: runner.os == 'Linux'
      shell: bash
      env:
        PROGRAM_NAME: ${{ inputs.name }}
        PROGRAM_VERSION: ${{ inputs.tag || github.ref_name }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: bash "${{ github.action_path }}/scripts/build-cpp.sh"

    - name: 构建 Cpp 程序（macOS）
      id: build-macos
      if: runner.os == 'macOS'
      shell: zsh {0}
      env:
        PROGRAM_NAME: ${{ inputs.name }}
        PROGRAM_VERSION: ${{ inputs.tag || github.ref_name }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: '"${{ github.action_path }}/scripts/build-cpp-macos.sh"'

    - name: 构建 Cpp 程序（Windows）
      id: build-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PROGRAM_NAME: ${{ inputs.name }}
        PROGRAM_VERSION: ${{ inputs.tag || github.ref_name }}
        BASE_DIR: ${{ inputs.base-dir }}
      run: '& "${{ github.action_path }}/scripts/build-cpp.ps1"'

    - name: 上传构建产物至 GitHub Release
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ inputs.tag || github.ref_name }}
        BASE_DIR: ${{ inputs.base-dir }}
        EXTRA_FILES: ${{ inputs.extra-files }}
        RELEASE_BODY: ${{ inputs.release-body }}
        RELEASE_NAME: ${{ inputs.release-name }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
      run: bash "${{ github.action_path }}/scripts/upload-release.sh"
